<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360度全景照片预览</title>
    
    <!-- 引入 Photo Sphere Viewer 核心样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.min.css"/>
    <!-- 引入自动旋转插件样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/autorotate-plugin@5/index.min.css"/>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #viewer {
            width: 100%;
            height: 100%;
        }
    </style>

    <!-- 关键：通过 Import Maps 映射 ES 模块路径 -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.module.js",
        "@photo-sphere-viewer/autorotate-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/autorotate-plugin@5/index.module.js"
      }
    }
    </script>
</head>
<body>

    <!-- 全景图容器 -->
    <div id="viewer"></div>

    <!-- 现代 ES 模块脚本入口 -->
    <script type="module">
        import { Viewer } from '@photo-sphere-viewer/core';
        import { AutorotatePlugin } from '@photo-sphere-viewer/autorotate-plugin';

        // 初始化全景图
        const viewer = new Viewer({
            container: document.querySelector('#viewer'),
            panorama: 'pano.jpg', // 确保同级目录下有该照片
            plugins: [
                [AutorotatePlugin, {
                    autorotateSpeed: '2rpm',
                    autostartDelay: 1000,
                }]
            ]
        });
    </script>

</body>
</html>
