<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360度全景 VR 体验 - Photo Sphere Viewer</title>
    
    <!-- 引入 Photo Sphere Viewer 样式文件 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.com/npm/@photo-sphere-viewer/core/index.min.css"/>
    
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
      }
      /* 全景容器撑满全屏 */
      #viewer {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>

    <!-- 全景图挂载容器 -->
    <div id="viewer"></div>

    <!-- 引入 Three.js 依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/three/build/three.min.js"></script>
    <!-- 引入 Photo Sphere Viewer 核心库 -->
    <script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.js"></script>

    <script>
      // 初始化 Photo Sphere Viewer
      const viewer = new PhotoSphereViewer.Viewer({
        container: document.querySelector('#viewer'),
        panorama: 'panorama-1.jpg', // 你的全景图片文件名
        autoload: true,
        // 默认加载时的视角配置
        defaultZoomLvl: 50,
        // 开启自带的导航栏组件（包含全屏、缩放、陀螺仪等按钮）
        navbar: [
          'zoom',
          'move',
          'download',
          'fullscreen'
        ]
      });
    </script>
  </body>
</html>
