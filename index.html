<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>360度全景古寺 VR 体验</title>
    <!-- 引入 A-Frame 框架 -->
    <script src="https://aframe.io/releases/1.5.0/js/aframe.min.js"></script>
    <style>
      body {
        margin: 0;
        background-color: #000;
      }
      /* 加载提示样式 */
      #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 18px;
        background: rgba(0, 0, 0, 0.8);
        padding: 12px 24px;
        border-radius: 8px;
        z-index: 999;
        pointer-events: none;
        transition: opacity 0.5s ease;
      }
    </style>
  </head>
  <body>
    <div id="loading">正在加载全景空间...</div>

    <a-scene loading-screen="enabled: false">
      <a-assets>
        <!-- 将上面获取的全景图保存并重命名为 panorama.jpg 放在同级目录下 -->
        <img id="pano" src="panorama.jpg" crossorigin="anonymous">
      </a-assets>

      <!-- 360度全景天空盒，添加 rotation 调整初始视角正面 -->
      <a-sky src="#pano" rotation="0 -90 0"></a-sky>

      <!-- 相机与交互准星 -->
      <a-camera position="0 1.6 0">
        <a-cursor fuse="false" raycaster="objects: [data-clickable]"></a-cursor>
      </a-camera>
    </a-scene>

    <script>
      // 监听图片加载，隐藏加载提示
      const img = document.querySelector('#pano');
      const loading = document.querySelector('#loading');
      
      if (img.complete) {
        loading.style.opacity = '0';
        setTimeout(() => loading.style.display = 'none', 500);
      } else {
        img.addEventListener('load', () => {
          loading.style.opacity = '0';
          setTimeout(() => loading.style.display = 'none', 500);
        });
      }
    </script>
  </body>
</html>
